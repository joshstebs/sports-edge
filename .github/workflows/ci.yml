name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build server
        run: npm run build:server

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify SportsEdge monitoring helper tests
        run: node --test scripts/monitor/*.test.mjs

      - name: Identify npm dependency warnings (diagnostics only)
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/monitor/audit-summary.mjs "$RUNNER_TEMP/npm-audit.json" --report-only
