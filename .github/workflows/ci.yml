name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, fix/pilot-fullscan-schedule-fallback-20261104]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Diagnose remaining server dependency advisories (non-blocking)
        continue-on-error: true
        run: |
          npm audit --prefix server --json > "$RUNNER_TEMP/server-audit.json" || true
          node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/server-audit.json","utf8"));if(!a.vulnerabilities||!a.metadata?.vulnerabilities)process.exit(2);console.log("Server npm audit totals:",JSON.stringify(a.metadata.vulnerabilities));for(const [name,v] of Object.entries(a.vulnerabilities)){console.log("Server npm advisory:",name,"severity:",v.severity,"affected:",v.range,"fixed:",JSON.stringify(v.fixAvailable));}'

      - name: Build server
        run: npm run build:server

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test REA scope and audit reporting
        run: node --test scripts/monitor/*.test.mjs
